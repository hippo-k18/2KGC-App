# Netlify build for the public conference website.
#
# `base` is this directory but Netlify checks out the whole repository, which
# matters: package.json depends on `@kgc/shared` and `@kgc/scripts` through
# `file:../../…`, so those paths must exist at install time. A build configured
# with only this folder as the source will fail to resolve them.
#
# @netlify/plugin-nextjs is what turns the App Router's server components,
# server actions and the Stripe webhook route into Netlify Functions. Without
# it you get a static export, and every server action 404s.

[build]
  base = "apps/web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Match the toolchain the app is developed and verified against. Netlify
  # defaults to a newer Node than Expo SDK 54's tooling is tested with.
  NODE_VERSION = "22"

  # The origin this site serves from, and the one thing a deploy must not be
  # allowed to forget. It is the canonical `@id` and `url` of the
  # `schema.org/Event` block and the base of every Open Graph image URL — the
  # formats crawlers republish — so an unset value is not a cosmetic bug, it is
  # structured data naming a host that is not this one. It is written here
  # rather than left to somebody remembering the Netlify UI.
  #
  # ⚠️ This is a *build* variable. Netlify does not pass `[build.environment]`
  # through to Functions, so the routes rendered per request read the site's own
  # environment variable instead — set `WEB_PUBLIC_ORIGIN` in the Netlify UI to
  # the same value (DEPLOY-NETLIFY.md lists it). `publicSiteOrigin()` in
  # `@kgc/shared` defaults to production if both are missing, which is the
  # recoverable failure; localhost was not.
  WEB_PUBLIC_ORIGIN = "https://kgc-2027-website.netlify.app"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Stripe posts here and signs the raw body. Never rewrite or redirect it.
[[headers]]
  for = "/api/stripe/webhook"
  [headers.values]
    Cache-Control = "no-store"
