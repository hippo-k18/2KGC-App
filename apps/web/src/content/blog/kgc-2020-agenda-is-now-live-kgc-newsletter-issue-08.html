<td><br/><strong><em>KGC 2020 Special Events</em></strong><br/><br/><strong>Enterprise Knowledge Graph Foundation</strong><br/>We are delighted to announce that we will launch the <a href="/about">Enterprise Knowledge Graph Foundation</a> (EKG Foundation) during the KGC 2020 on May 5th at 1:30 pm.<br/><br/>The EKG Foundation is a new non-profit organization focusing on the growth of the marketplace for semantic technology, the development of best practices for sustainable EKG, and the adoption of a shared infrastructure for collaborative data management.  <strong>KG Startup Pitch</strong><br/>  This event provides KG startups the opportunity to pitch to and receive direct feedback from a panel of top-tier investors from <a href="https://www.linkedin.com/company/er-accelerator/" rel="noopener noreferrer">Entrepreneurs Roundtable Accelerator</a>,<a href="https://www.linkedin.com/company/tessera-venture-partners/" rel="noopener noreferrer"> Tessera Venture Partners</a>,<a href="https://www.linkedin.com/company/frontline-ventures/" rel="noopener noreferrer"> Frontline Ventures</a> and more.<br/><br/>If selected to participate, startups will receive a complimentary ticket to the conference, and will prepare a 5-minute pitch for a live session with investors on May 5th, 10am-12pm. The finalist will present on the virtual main stage of the Knowledge Graph Conference on May 6th-7th.<br/><br/>Interested? Apply here: <a href="https://lnkd.in/d83d8MF" rel="noopener noreferrer">https://lnkd.in/d83d8MF</a>.   <br/><br/><br/><strong>KG Meetup</strong> <br/><strong>Knowledge Graphs to Fight Covid-19 Meetup – Part 2</strong><br/><br/>Continued lively discussion on how knowledge graphs are being leveraged to address the challenges of the Covid-19 pandemic.<br/><br/>View the Zoom video <a href="https://www.youtube.com/watch?v=HkVfGikcjOo&amp;feature=youtu.be" rel="noopener noreferrer">here</a>. The segments are as follows: 12:15pm EST – <a href="http:// https://douroucouli.wordpress.com/2020/04/06/building-a-covid-19-knowledge-graph/" rel="noopener noreferrer">Chris Mungal</a>, Department Head, Molecular Ecosystems Biology, Berkeley Lab 12:30pm EST – <a href="https://thegraphlounge.com/vocabulary-for-the-virus-schema-org-7-0/" rel="noopener noreferrer">Aaron Bradley</a>, The Graph Lounge 12:45pm EST – <a href="https://github.com/fhircat/CORD-19-on-FHIR" rel="noopener noreferrer">David Booth</a>, Yosemite Project 1pm EST – <a href="https://egonw.github.io/SARS-CoV-2-Queries/" rel="noopener noreferrer">Egon Willighagen</a>, Department of Bioinformatics – Maastricht University. 1:15 EST – <a href="https://www.linkedin.com/in/kurtcagle/" rel="noopener noreferrer">Kurt Kagle</a>, Founder, Semantical LLC, on news and safety measures aggregation. And here’s a nice <a href="https://thegraphlounge.com/knowledge-graphs-in-the-fight-against-covid-19/" rel="noopener noreferrer">summary</a> of the meetup from Aaron Bradley.<br/><br/><br/><strong>Upcoming KG Events </strong>   <br/><br/>TopQuadrant Webinar <a href="https://www.topquadrant.com/how-implementing-data-governance-with-knowledge-graphs-enables-enterprise-ai/" rel="noopener noreferrer">How Implementing Data Governance with Knowledge Graphs Enables Enterprise AI</a>, April 16   <br/><br/>Connected Data London Online Meetup <a href="https://connected-data.london/2020/04/09/online-meetup-april-22-2020-facilitating-covid-19-research-connecting-the-dots-with-graph-analytics-knowledge-graphs/" rel="noopener noreferrer">Facilitating COVID-19 Research, Connecting the Dots with Graph Analytics &amp; Knowledge Graphs</a>, April 22<br/><br/><strong>Knowledge Graphs in the News </strong><br/><br/>Coronavirus pandemic has prompted <a href="https://thegraphlounge.com/vocabulary-for-the-virus-schema-org-7-0/" rel="noopener noreferrer">new vocabularies at Schema.org</a>.    <br/><br/>Potential new treatment for COVID-19 enters trials, uncovered by <a href="https://techcrunch.com/2020/04/14/potential-new-treatment-for-covid-19-uncovered-by-benevolentai-enters-trials/" rel="noopener noreferrer">BenevolentAI via its knowledge graph</a>.    <br/><br/>U.S. Department of State Partners with Yext to Develop <a href="https://finance.yahoo.com/news/u-department-state-partners-yext-230000879.html" rel="noopener noreferrer">COVID-19 Information Hub.</a><br/> <br/><strong>Ideas &amp; Insights</strong><br/><br/>Stanford University KG Seminar <a href="https://youtu.be/bvwjG-3qAmY" rel="noopener noreferrer">Session 1</a> – What is a Knowledge Graph?<br/>  <br/>How to create quality articles across languages on Wikipedia? Wikidata founder Denny Vrandecic proposed solutions – <em><a href="https://www.neowin.net/news/wikidata-founder-floats-idea-for-balanced-multilingual-wikipedia" rel="noopener noreferrer">Abstract Wikipedia and Wikilambda</a></em>. Fore more on Denny’s vision, check out his <a href="https://youtu.be/Oips1aW738Q" rel="noopener noreferrer">talk</a> at KGC 2019.     <br/><br/>Walmart Lab has been working on a Retail Graph to empower their semantic search engine and product recommendation. <a href="https://medium.com/walmartlabs/retail-graph-walmarts-product-knowledge-graph-6ef7357963bc" rel="noopener noreferrer">Here</a>’s how they do it.    <br/><br/>A comprehensive effort to organize and represent the most current knowledge of coronavirus biology and pathophysiology – <a href="https://www.biorxiv.org/content/10.1101/2020.04.14.040667v1" rel="noopener noreferrer">COVID-19 Knowledge Graph</a> – a computable, multimodal, cause-and-effect knowledge model by researchers from Germany and India.     <br/><br/><a href="https://www.propmodo.com/understanding-the-effects-of-the-pandemic-on-real-estate-requires-property-level-data/" rel="noopener noreferrer">Understanding the effects of the pandemic on real estate requires property level data</a>, where Ron Bekkerman, CTO of Cherre, one of our KGC 2020 speakers suggested rethinking the models to assess the blanket effect of stay-at-home order on real estate property.    <br/><br/>The structured representation of scholarly knowledge via Open Research Knowledge Graph (ORKG) has enabled the automation of literature overviews, the progression and the current state of knowledge as well as machine actionable data analytics. See how it is done on the <a href="https://blogs.tib.eu/wp/tib/2020/04/08/organizing-covid-19-research-with-the-open-research-knowledge-graph/" rel="noopener noreferrer">COVID-19 research</a>.   <br/><br/>Ontology driven data architectures has demonstrated rapid adaptation and evolvability in the <a href="https://covid-19.cochrane.org/" rel="noopener noreferrer">COVID19 project</a> led by <a href="https://datalanguage.com/blog/how-knowledge-graph-technology-is-helping-cochrane-respond-to-covid-19" rel="noopener noreferrer">Data Language</a> for Cochrane, a global independent network of researchers, professionals, patients, carers and people interested in health. <br/>   <br/><br/><strong>Thanks to Our Sponsors</strong>   <br/><img alt="" decoding="async" height="268" loading="lazy" src="/kgc/blog/content/kgc-2020-agenda-is-now-live-kgc-newsletter-issue-08/eYj4PhjGQOFvcuZokMpt9EFacyIBkpNgpbRRuvj7RSk7ZPVD2LrO41L5JuQPM6L1dl7x9z16sK02DxPjM0DINXfMSf3ZowLUQMPaE0lWQfU0dcAIKTW5A8ZFYZZHWkA4O5ZlS_s2" width="624"/><img alt="" decoding="async" height="243" loading="lazy" src="/kgc/blog/content/kgc-2020-agenda-is-now-live-kgc-newsletter-issue-08/pv4znRFBJA5mjXKN5QYPy24BSwqSTRh3M8hetKnsFaTNNY46mJSra3KuzxxH_HatLu3H0QV5uZq5QETUWBwO828QRVj0n5ibtVhgd7XEVHQzBKPmkXT0MuFhhjBcQcOqMmSpjda5" width="624"/>  <br/><br/><strong>Please Follow Us </strong>    <br/><br/><a href="https://www.linkedin.com/company/the-knowldge-graph-conference/" rel="noopener noreferrer"><u>KGC LinkedIn</u></a>   <a href="https://www.facebook.com/pg/Knowledge-Graph-Conference-111481247181966/posts/?ref=page_internal" rel="noopener noreferrer"><u>KGC Facebook</u></a>   <a href="https://www.instagram.com/kgconference/" rel="noopener n
