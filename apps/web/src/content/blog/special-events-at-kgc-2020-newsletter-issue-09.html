<td>Hi there,    <br/><br/>The Knowledge Graph Conference 2020 is coming in less than a week!  <br/>  <br/>Are you ready to be dazzled by the stardom of our speakers this year?   <br/><br/>Here’s a moment of unveiling our special events at the KGC 2020. <br/><br/><strong>KGC 2020</strong><br/><strong>Workshop – Personal Health Knowledge Graphs</strong> <br/>May 5th, 9 am – 5 pm EST<br/><br/><strong>Keynotes</strong><br/><br/><strong>Harmonizing EHR and patient-generated healthcare data for breast cancer risk assessment and precision prevention in primary care settings</strong> <a href="https://www.mailman.columbia.edu/people/our-faculty/rk326" rel="noopener noreferrer"><u>Rita Kukafka</u></a>, Professor, Sociomedical Sciences and Biomedical Informatics, Columbia University Medical Center <br/><br/><strong>Personalizing health data in knowledge graph technologies</strong> <a href="https://www.cs.rpi.edu/~hendler/" rel="noopener noreferrer"><u>Jim Hendler</u></a>, Director, Rensselaer Institute for Data Exploration and Applications, Director, RPI-IBM Center on Health Empowerment by Analytics, Learning and Semantics<br/><br/><strong>Panels</strong><br/><br/><strong>State-of-the-art in personal health applications </strong> Panelists:<a href="https://www.mailman.columbia.edu/people/our-faculty/rk326" rel="noopener noreferrer"> <u>Rita Kukafka</u></a>,<a href="https://www.linkedin.com/in/constantina-papoutsakis-phd-rd-841511102/" rel="noopener noreferrer"> <u>Constantina (Tina) Papoutsakis</u></a>,<a href="https://researcher.watson.ibm.com/researcher/view.php?person=us-jeffrogers" rel="noopener noreferrer"> <u>Jeff Rogers</u></a><br/>Moderator:<a href="https://researcher.watson.ibm.com/researcher/view.php?person=us-chinghua" rel="noopener noreferrer"> <u>Ching-HuaChen</u></a> <br/><br/><strong>Methods for personal health knowledge graphs </strong> Panelists:<a href="https://www.cs.rpi.edu/~hendler/" rel="noopener noreferrer"> <u>Jim Hendler</u></a>,<a href="https://ruben.verborgh.org/" rel="noopener noreferrer"> <u>Ruben Verborgh</u></a>,<a href="https://pdi.fbk.eu/people/profile/dragoni" rel="noopener noreferrer"> <u>Mauro Dragoni</u></a><br/>Moderator:<a href="https://tw.rpi.edu/web/person/Deborah_L_McGuinness" rel="noopener noreferrer"> <u>Deborah McGuinness</u></a><br/><br/><em>For the full workshop agenda, please visit </em><a href="https://suitclub.ischool.utexas.edu/PHKG2020/index.html" rel="noopener noreferrer"><u>here</u></a><em>.</em><br/><br/><br/><strong>Panel – Frontiers in Data Intelligence </strong> <br/>May 7th, 4pm EST   <br/><em>Putting intelligence into data use; where data intelligence is a new intellective skill base for “ethical” data use. </em> <br/>Moderator <a href="https://www.linkedin.com/in/pieterdeleenheer/" rel="noopener noreferrer"><u>Pieter De Leenheer</u></a>, Cofounder, Chief Scientist, Collibra <br/>Panelists  <br/><a href="https://en.wikipedia.org/wiki/Amit_Sheth" rel="noopener noreferrer"><u>Amit Sheth</u></a>, Founding Director, Artificial Intelligence Institute, University of South Carolina <br/><a href="https://acid.sdsc.edu/users/jim-short" rel="noopener noreferrer"><u>Dr. Jim Short</u></a>, Lead Scientist &amp; Co-Founder, Center for Large Scale Data Systems (CLDS), San Diego Supercomputer Center <br/><a href="https://en.wikipedia.org/wiki/Helen_Nissenbaum" rel="noopener noreferrer"><u>Helen Nissenbaum</u></a>, Professor of Information Science, Cornell Tech <br/><a href="http://stoyanovich.org/" rel="noopener noreferrer"><u>Julia Stoyanovich</u></a>, Assistant Professor, Dept of Science and Engineering at NYU Tandon <br/><a href="http://www.rummanchowdhury.com/" rel="noopener noreferrer"><u>Rumman Chowdhury</u></a>, Responsible AI Lead, Accenture   <br/><br/><strong>Launch Event – Enterprise Knowledge Graph Foundation </strong> <br/>May 5th, 1:30 pm EST<br/><br/>We will formally launch the <a href="/about">Enterprise Knowledge Graph Foundation</a> (EKG Foundation) during the KGC 2020. EKG Foundation is a new non-profit organization focused on the growth of the marketplace for semantic technology, the development of best practices for sustainable EKG and the adoption of a shared infrastructure for collaborative data management. <br/><br/><em>Also check out the <a href="https://www.knowledgegraph.tech/the-knowledge-graph-conference-kgc/workshops-and-tutorials/" rel="noopener noreferrer">tutorials</a>, <a href="https://knowledgegraphsocialgood.pubpub.org/" rel="noopener noreferrer">Knowledge Graphs for Social Good workshop</a>, <a href="/startup-pitch">Startup Investor Pitch</a>, and our main conference program <a href="/agenda">here</a>!</em><br/> <br/><br/><strong>KGC 2020 Tickets</strong><br/><br/><em>Join over 250 currently registered attendees.<br/>Enjoy access to all talks, workshops, and tutorials.</em><br/><br/>*Early Bird Ticket Sale Ends on April 27</td>

<td><br/><em>KG Events</em>   <br/><strong>KGC 2020 LinkedIn Live</strong> <br/><br/>On April 21 Tuesday, hundreds of viewers from around the world joined the KGC 2020 LinkedIn Live with 17 KGC speakers, facilitated by Kate Stratchnyi from Story By Data. The event sparked new interest and lively discussion around the much-anticipated KGC 2020. If you missed the live stream, now you can still catch it by viewing the recording <a href="https://www.youtube.com/playlist?list=PLuaewijR5o56xg5RgudEMWO6BOXTPQiLw" rel="noopener noreferrer"><u>here</u></a>.    <br/><br/><strong>Humanitarian AI Talk </strong> <br/><br/>Lambert Hogenhout (United Nations) and Vivek Khetan (Accenture) spoke to Humanitarian AI Today’s host Mia Kossiavelou about their Graphs4Good Hackathon project linked to the Sustainable Development Goals. Check it out <a href="https://soundcloud.com/humanitarian-ai-today/lambert-hogenhout-vivek-khetan" rel="noopener noreferrer"><u>here</u></a>.<br/>  <br/><strong>The Graph Lounge</strong> <br/><br/>For more learning on knowledge graphs, linked data and other connected things, check out Graph Lounge’s <a href="https://thegraphlounge.com/events/category/online-events/" rel="noopener noreferrer"><u>upcoming events</u></a>.<br/><br/><strong> Knowledge Graphs in the News </strong><br/><br/><a href="https://www.news-medical.net/news/20200424/Fraunhofer-SCAI-is-opening-a-new-knowledge-space-with-analysis-tools-and-information-on-COVID-19.aspx" rel="noopener noreferrer"><u>Fraunhofer SCAI</u></a> is opening a new <a href="https://www.covid19-knowledgespace.de/" rel="noopener noreferrer"><u>knowledge space</u></a> with information and analysis tools on COVID-19. <br/><br/><a href="https://pages.semanticscholar.org/coronavirus-research" rel="noopener noreferrer"><u>CORD-19</u></a> has given rise to <a href="https://www.geekwire.com/2020/software-tools-mining-covid-19-research-studies-go-viral-among-scientists/" rel="noopener noreferrer"><u>software tools for mining COVID-19 research studies</u></a> that went viral among scientists.   <br/><br/><a href="https://searchbusinessanalytics.techtarget.com/news/252481896/NLQ-developer-tools-highlight-Sisense-BI-platform-update" rel="noopener noreferrer"><u>NLQ</u></a> – a new natural language query tool that’s built on graph technology and a hub for low-code/no-code embedded application development.   <br/><br/><a href="https://www.cardrates.com/news/cognicor-is-a-digital-assistant-drives-call-center-efficiency/" rel="noopener noreferrer"><u>CogniCor</u></a> – a context-aware digital assistant that streamlines financial call centers to drive efficiency and engagement. <br/><br/><a href="https://www.technologynetworks.com/applied-sciences/blog/learning-to-share-can-help-agriculture-endure-now-and-in-the-future-333503" rel="noopener noreferrer"><u>Agrimetrics</u></a> – an agriculture-food data marketplace that utilizes knowledge graphs to manage the food system during the coronavirus pandemic.<br/> <br/><strong>Ideas &amp; Insights</strong><br/>  <br/><a href="https://coronavirus.causalitylink.com/" rel="noopener noreferrer"><u>Causality Link</u></a> maps the impact of coronavirus across countries and economy sectors.    <br/><br/><a href="https://www.forbes.com/sites/falonfatemi/2020/04/15/three-platforms-where-ai-bias-lives/" rel="noopener noreferrer"><u>Three platforms</u></a> where AI bias lives –  hiring tools, collaboration tools, sales tools.   <br/><br/><a href="https://theconversation.com/were-measuring-online-conversation-to-track-the-social-and-mental-health-issues-surfacing-during-the-coronavirus-pandemic-135417" rel="noopener noreferrer"><u>Track</u></a> the social and mental health issues surfacing during the coronavirus pandemic from online conversations using knowledge graphs. <br/>  <br/><a href="https://cordis.europa.eu/article/id/417984-big-data-to-personalise-therapy-for-lung-cancer-and-alzheimer-s-diseases-analysing-data-with-" rel="noopener noreferrer"><u>Big Data </u></a>to personalize therapy for Lung Cancer and Alzheimer’s diseases.  <br/><br/><a href="https://pharmafield.co.uk/opinion/graph-databases-the-key-to-groundbreaking-medical-research/" rel="noopener noreferrer"><u>Graph Databases</u></a> –  the key to groundbreaking medical research.</td>
