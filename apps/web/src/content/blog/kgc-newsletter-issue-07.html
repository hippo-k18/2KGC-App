<td>  <br/><strong>KGC 2020 Workshops</strong><br/><br/><strong>Personal Health Knowledge Graph Workshop</strong><br/><br/> Join health practitioners, health informaticists, knowledge engineers, and computer scientists at the KGC 2020 – <a href="https://suitclub.ischool.utexas.edu/PHKG2020" rel="noopener noreferrer">Personal Health Knowledge Graph Workshop</a>, organized by researchers from IBM, University of Austin, Rensselaer Polytechnic Institute.<br/><br/><strong>Knowledge Graphs for Social Good Workshop</strong><br/><br/>Help the United Nations achieve sustainable development goals at the KGC 2020 – <a href="https://knowledgegraphsocialgood.pubpub.org/callforpapers" rel="noopener noreferrer">Knowledge Graphs for Social Good Workshop</a>. Check out their <a href="https://twitter.com/KGConference/status/1243714355155345409?s=20" rel="noopener noreferrer">video kickoff</a> by organizers Lambert Hogenhout, UN  and Vivek Khetan, Accenture.   <br/><br/><strong>KGC 2020 Startup Pitch Event</strong>   <br/><br/>KGC 2020 will have a pitch event for early-stage startups in the knowledge graph space. If you are interested in participating, please apply <a href="https://docs.google.com/forms/d/e/1FAIpQLScF_8wNtSjR_b7mDjD8mgvfPY-xXEX-OfSTzw8uWz8ip8WEZg/viewform" rel="noopener noreferrer">here</a>. <br/> <br/><strong>KG Meetup </strong>– <strong>Knowledge Graphs to Fight Covid-19</strong>   <br/><br/>On Wed April 1st, KG practitioners and enthusiasts gathered over our virtual KG Meetup to discuss the topic that’s on everyone’s mind – Covid-19 pandemic and how knowledge graphs could be leveraged to address this crisis.    <br/><br/>View the Zoom video <a href="https://www.youtube.com/watch?v=HkVfGikcjOo&amp;feature=youtu.be" rel="noopener noreferrer">here</a>, and the segments are as follows:  <br/>13:00  Kinglsey Idehen (CEO at OpenLink Software), Covid-19 publication cloud knowledge graph.  <br/>29:45  Gilles Vandewiele (PhD student at University of Gent), KG on scientific itecture for a multilingual Wikipedia</a> from Denny Vrandecic, one of our KGC 2019 Speakers.    <br/><br/><a href="https://www.technologyreview.com/s/615416/ai-debate-gary-marcus-danny-lange/" rel="noopener noreferrer">A debate</a> between AI experts shows a battle over the technology’s future.     <br/><a href="https://syncedreview.com/2020/03/28/physical-distancing-boosts-ai-powered-online-education-in-china/" rel="noopener noreferrer">Physical Distancing</a> boosts AI-powered online education in China.<br/>  <br/><strong>Last but not least</strong><br/><br/>If you are interested in sponsoring KGC 2020, please see our updated <a href="https://docs.google.com/document/d/e/2PACX-1vRM4alChXLY0Cl4Y3XjJzDfPoeuNic_p02ekNs3Gz5eEmJPHYCzcsAeB46bh2R8ngGZiyJAxadl3ZY8/pub" rel="noopener noreferrer">sponsorship package</a> and get in touch with us at info@knowledgegraph.tech. <br/><br/>If you are interested in volunteering for the KGC 2020, please also contact us at info@knowledgegraph.tech. <br/> <br/>That’s all for now from us.<br/><br/>We look forward to seeing you virtually at KGC 2020 in May.<br/><br/><br/>Best,<br/>KGC Organizing Team</td>
